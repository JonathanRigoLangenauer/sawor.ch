							{ name: "Prism Stepper Motor", partNo: "CB-002", compat: "Rotating Prism Assembly", price: 9 },

					{

						items: [
							{ name: "Power Supply Board (PSU)", partNo: "CB-013", compat: "Main Power Supply / Base Assembly", price: 29 },
							{ name: "65 W LED Module", partNo: "CB-014", compat: "Light Source / Head Assembly", price: 39 },
							{ name: "Main Control Board", partNo: "CB-015", compat: "Main Electronics / Base Assembly", price: 39 },
							{ name: "DMX Input/Output Connector Assembly", partNo: "CB-016", compat: "DMX Input / Output", price: 9 },
							{ name: "PowerCon Compatible Connector", partNo: "CB-017", compat: "Mains Power Input", price: 8 },
							{ name: "Power Switch", partNo: "CB-018", compat: "Mains Power Input", price: 5 },
							{ name: "Fuse Holder", partNo: "CB-019", compat: "Mains Power Input", price: 4 },
							{ name: "Mains Fuse – F3AL 250V", partNo: "CB-020", compat: "Mains Power Input / Fuse Holder", price: 2 },
							{ name: "Tilt Position Sensor", partNo: "CB-021", compat: "Tilt Position Detection", price: 6 },

							{ name: "LED Cooling Fan Cable", partNo: "CB-024", compat: "Main Control Board → LED Cooling Fan", price: 5 },
							{ name: "Tilt Position Sensor Cable", partNo: "CB-025", compat: "Tilt Drive Assembly", price: 5 },
							{ name: "Pan Motor Cable", partNo: "CB-026", compat: "Main Control Board → Pan Stepper Motor", price: 5 },
							{ name: "Tilt Motor Cable", partNo: "CB-027", compat: "Main Control Board → Tilt Stepper Motor", price: 5 },

							{ name: "Tilt Timing Belt", partNo: "CB-036", compat: "Tilt Drive Assembly", price: 5 },

						]
					},
					{
						category: "Housing Parts",
						items: [
							{ name: "Head Housing Half", partNo: "CB-043", compat: "Head Housing", price: 9 },
							{ name: "Yoke Arm Cover", partNo: "CB-044", compat: "Yoke Assembly", price: 8 },
							{ name: "Yoke Arms", partNo: "CB-045", compat: "Yoke Assembly", price: 12 },
							{ name: "Base Front Cover", partNo: "CB-046", compat: "Base Housing – Front", price: 8 },
							{ name: "Base Back Cover", partNo: "CB-047", compat: "Base Housing – Rear", price: 8 },
							{ name: "Main Base Housing", partNo: "CB-048", compat: "Base Assembly", price: 15 },
							{ name: "Head Side Cover A", partNo: "CB-049", compat: "Head Housing – Side A", price: 8 },
							{ name: "Head Side Cover B", partNo: "CB-050", compat: "Head Housing – Side B", price: 8 },
							{ name: "Head Housing Insert", partNo: "CB-051", compat: "Head Assembly", price: 10 }
						]
					}
				];

				(function () {
					var container = document.getElementById('parts-container');
					var searchInput = document.getElementById('parts-search');
					var emptyMsg = document.getElementById('parts-search-empty');

					function cardHtml(item) {
						var img = 'images/spareparts/' + item.partNo + '.jpg';
						return '' +
							'<div class="part-card bg-zinc-900 border border-zinc-800 rounded-md p-4 flex flex-col gap-3" data-search="' + (item.name + ' ' + item.partNo + ' ' + item.compat).toLowerCase() + '">' +
								'<div class="w-full aspect-square bg-gray-200 rounded overflow-hidden flex items-center justify-center">' +
									'<img src="' + img + '" alt="' + item.name + '" loading="lazy" class="max-w-full max-h-full object-contain" />' +
								'</div>' +
								'<div class="flex flex-col gap-1 flex-1">' +
									'<div class="text-white text-sm font-semibold leading-snug">' + item.name + '</div>' +
									'<div class="text-gray-500 text-xs font-mono uppercase tracking-wider">' + item.partNo + '</div>' +
									'<div class="text-gray-400 text-xs leading-snug">' + item.compat + '</div>' +
								'</div>' +
								'<div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-zinc-800">' +
									'<span class="text-white font-bold text-base">' + item.price + ' CHF</span>' +
									'<span aria-disabled="true" class="bg-zinc-800 text-gray-400 text-xs font-bold uppercase tracking-wider whitespace-nowrap px-3 py-2 rounded cursor-not-allowed">' +
										'From 14 Nov' +
									'</span>' +
								'</div>' +
							'</div>';
					}

					PARTS_DATA.forEach(function (group, gi) {
						var section = document.createElement('section');
						section.className = 'parts-category' + (gi === 0 ? ' mt-2' : ' mt-14');

						var heading = document.createElement('h3');
						heading.className = 'text-white text-lg md:text-xl font-bold uppercase tracking-widest border-b border-zinc-800 pb-2 mb-6';
						heading.textContent = group.category;
						section.appendChild(heading);

						var grid = document.createElement('div');
						grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6';
						grid.innerHTML = group.items.map(cardHtml).join('');
						section.appendChild(grid);

						container.appendChild(section);
					});

					function setHidden(el, hide) {
						// tailwind's `important: true` config makes utility classes like
						// `flex`/`grid` win over a plain inline style, so force priority here
						if (hide) {
							el.style.setProperty('display', 'none', 'important');
						} else {
							el.style.removeProperty('display');
						}
					}

					searchInput.addEventListener('input', function () {
						var q = searchInput.value.trim().toLowerCase();
						var anyVisible = false;

						document.querySelectorAll('.parts-category').forEach(function (section) {
							var sectionHasVisible = false;
							section.querySelectorAll('.part-card').forEach(function (card) {
								var match = !q || card.getAttribute('data-search').indexOf(q) !== -1;
								setHidden(card, !match);
								if (match) sectionHasVisible = true;
							});
							setHidden(section, !sectionHasVisible);
							if (sectionHasVisible) anyVisible = true;
						});

						emptyMsg.classList.toggle('hidden', anyVisible);
					});
				})();
			</script>
